title: 'VT-Guard VTR-BIN-05: image=net.exe & cmd~''administrator'''
id: 95b6555e-1883-56be-867c-7bb8a9698761
status: experimental
description: 'VT-Guard auto-induced rule VTR-BIN-05 (RIPPER on Train, dataset-v1.2). Target: bin (T1016, T1018, T1087.002, T1654). Train support 18 windows (precision 1.0), OOF precision 1.0 on 10 windows. Predicate: image=net.exe & cmd~''administrator''.'
author: VT-Guard auto rule engine
date: 2026-10-17
tags:
    - attack.discovery
    - attack.t1016
    - attack.t1018
    - attack.t1087.002
    - attack.t1654
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\net.exe'
        CommandLine|re: '(?i)(^|[^a-z0-9_.<>/\\-])administrator($|[^a-z0-9_.<>/\\-]|\\")'
    condition: selection
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - Computer
falsepositives:
    - Administrative scripts running the same discovery / maintenance commands (see T-hard evaluation)
level: medium
vtguard_provenance:
    rule_id: VTR-BIN-05
    target: 'bin'
    provenance_file: 'reports/step7/rules_provenance.json'
    dataset: dataset-v1.2
    induced_from: Train only (483 windows)
    engine: 'wittgenstein RIPPER (k=2, prune_size 0.33)'
    train_support: 18
    train_precision: 1.0
    oof_precision: 1.0
    oof_windows: 10
    folds_rediscovered: 3
    window_semantics: 'fires on a window (<= 64 events of one session) if every predicate matches >= 1 event'
